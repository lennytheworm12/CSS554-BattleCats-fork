task zipForSubmit(type: Zip) {
  description 'Produce a zip file for submission.'
  group 'battlecode'

  archiveFileName = 'submission.zip'
  destinationDirectory = project.projectDir
  dependsOn classes
  from('src') {
    include 'battlecats/**/*.java'
  }
}
