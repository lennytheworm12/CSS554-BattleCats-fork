def clientName = os.startsWith('windows')
                    ? 'battlecode26-client-win-'
                    : os.startsWith('mac')
                        ? 'battlecode26-client-mac-'
                        : 'battlecode26-client-linux-'
def clientType = project.findProperty("compatibilityClient").toBoolean()
                    ? "electron"
                    : "tauri"

dependencies {
  testImplementation group: 'junit', name: 'junit', version: '4.13.2'

  // The Battlecode engine.
  implementation group: 'org.battlecode', name: 'battlecode26-java', version: versions.battlecodeEngine

  // The Battlecode client.
  client group: 'org.battlecode', name: clientName + clientType, version: versions.battlecodeClient

  // Scala
  implementation group: 'org.scala-lang', name: 'scala-library', version: '2.13.11'
  testImplementation group: 'org.scalatest', name: 'scalatest_2.13', version: '3.2.9'
}


//////// Unit tests and coverage ////////

jacoco {
  // Pinned for reproducible reports; this release supports Java 21 class files.
  toolVersion = '0.8.12'
}

// Measure the complete submitted team package, including untested classes.
// Bundled example opponents and engine dependencies are not our production code.
def teamClassFiles = sourceSets.main.output.classesDirs.asFileTree.matching {
  include 'battlecats/**/*.class'
}

jacocoTestReport {
  dependsOn test
  classDirectories.setFrom(teamClassFiles)
  sourceDirectories.setFrom(files('src'))
  reports {
    html.required = true
    xml.required = true
    csv.required = false
  }
}

jacocoTestCoverageVerification {
  dependsOn test
  classDirectories.setFrom(teamClassFiles)
  violationRules {
    rule {
      element = 'BUNDLE'
      limit {
        counter = 'LINE'
        value = 'COVEREDRATIO'
        // Sprint 2 requires strictly more than 20%; 21% provides a clear margin.
        minimum = 0.21
      }
    }
  }
}

test.finalizedBy jacocoTestReport
check.dependsOn jacocoTestReport, jacocoTestCoverageVerification


//////// Client ////////

def arch64 = System.getProperty("os.arch").matches("^(x86_64|amd64|ia32e|em64t|x64)\$")
def arch32 = System.getProperty("os.arch").matches("^(x86_32|x86|i[3-6]86|ia32|x32)\$")

if (arch32) {
  logger.error('Sorry, the local Battlecode client does not support 32-bit architectures. Ensure you installed the 64-bit JDK')
}

// Add the unpackClient task, but only do it when we are not on the server
if (!(project.findProperty("onSaturn") ?: "false").toBoolean()) {
  task unpackClient(type: Copy) {
    description 'Downloads the client.'
    group 'battlecode'

    dependsOn configurations.client
    finalizedBy checkNewVersion

    from {
      configurations.client.collect {
        zipTree(it)
      }
    }
    into 'client/'
  }

  build.configure {
    group 'battlecode'
    dependsOn unpackClient
  }
}

task verify(type: JavaExec) {
  description 'Runs basic verifications that a package is valid.'
  group 'battlecode'
  dependsOn jar

  mainClass = 'battlecode.instrumenter.Verifier'
  classpath = sourceSets.main.runtimeClasspath
  args = [
    project.findProperty("team") ?: "battlecats",
    // Engine 1.2.6's folder verifier mishandles Windows path separators.
    // JAR entries use forward slashes on every platform.
    project.findProperty("url") ?: tasks.jar.archiveFile.get().asFile.absolutePath,
  ]
}


//////// Running ////////

// Shared entry point keeps version listing independent of engine downloads.
def runSimulation = { boolean listOnly ->
    boolean windows = System.getProperty('os.name').toLowerCase().contains('windows')
    def override = project.findProperty('simPython')
    def choices = override ? [[override.toString()]] :
      (windows ? [['py', '-3'], ['python'], ['python3']] : [['python3'], ['python'], ['py', '-3']])
    List<String> pythonCommand = null
    for (choice in choices) {
      String executable = choice[0]
      File resolved = null
      if (override || executable.contains('/') || executable.contains('\\')) {
        resolved = project.file(executable)
      } else {
        for (directory in (System.getenv('PATH') ?: '').split(File.pathSeparator)) {
          File candidate = new File(directory.replace('"', ''), executable + (windows ? '.exe' : ''))
          if (candidate.isFile() && (windows || candidate.canExecute())) {
            // Windows Store aliases can open a store window instead of Python.
            if (windows && candidate.absolutePath.toLowerCase().contains('\\microsoft\\windowsapps\\')) {
              continue
            }
            resolved = candidate
            break
          }
        }
      }
      if (resolved == null || !resolved.isFile() ||
          (windows && resolved.absolutePath.toLowerCase().contains('\\microsoft\\windowsapps\\'))) {
        continue
      }
      def trial = [resolved.absolutePath] + choice.drop(1)
      try {
        def probe = new ProcessBuilder(trial + ['-c',
          'import sys; print(sys.version.split()[0]); sys.exit(0 if sys.version_info >= (3, 10) else 1)'])
          .directory(projectDir).redirectErrorStream(true).start()
        if (!probe.waitFor(10, TimeUnit.SECONDS)) {
          probe.destroyForcibly()
          continue
        }
        String detected = probe.inputStream.getText('UTF-8').trim()
        if (probe.exitValue() == 0) {
          pythonCommand = trial
          logger.quiet("Simulation Python: ${detected}")
          break
        }
      } catch (IOException ignored) {
        // Try the next real interpreter rather than a shell or store alias.
      }
    }
    if (pythonCommand == null) {
      throw new GradleException('Python 3.10+ was not found. Install Python or pass -PsimPython=/path/to/python.')
    }
    def argv = pythonCommand + [file('tools/simulate.py').absolutePath]
    if (listOnly) {
      argv.add('--list-versions')
    } else {
      def engine = configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.find {
        it.moduleVersion.id.group == 'org.battlecode' && it.name == 'battlecode26-java'
      }?.file
      if (engine == null) {
        throw new GradleException('The Battlecode engine dependency could not be resolved.')
      }
      argv.addAll(['--java-home', System.getProperty('java.home'), '--engine-jar', engine.absolutePath,
        '--preset', (project.findProperty('simPreset') ?: 'quick').toString()])
    }
    ['simBaseline': '--baseline-ref', 'simCandidate': '--candidate-ref',
     'simPackage': '--package', 'simBaselinePackage': '--baseline-package',
     'simOutput': '--output', 'simLabel': '--label'].each { propertyName, option ->
      if (!listOnly && project.hasProperty(propertyName)) {
        argv.addAll([option, project.property(propertyName).toString()])
      }
    }
    if (!listOnly && project.hasProperty('simMaps')) {
      def maps = project.property('simMaps').toString().split(',').collect { it.trim() }
      if (maps.any { it.isEmpty() }) {
        throw new GradleException('simMaps must be a comma-separated list of map names.')
      }
      argv.add('--maps')
      argv.addAll(maps)
    }
    ['simOffline': '--offline', 'simPrepareOnly': '--prepare-only', 'simSelect': '--select'].each { propertyName, option ->
      if ((!listOnly || propertyName == 'simOffline') &&
          (project.findProperty(propertyName) ?: 'false').toString().toBoolean()) {
        argv.add(option)
      }
    }
    project.exec {
      workingDir projectDir
      commandLine argv
      standardInput System.in
    }
}

tasks.register('sim') {
  description 'Compares saved local Java changes or selected versions on both starting sides.'
  group 'battlecode'
  doLast { runSimulation(false) }
}

tasks.register('simVersions') {
  description 'Lists available bot branches, tags, and recent commits without compiling.'
  group 'battlecode'
  doLast { runSimulation(true) }
}

task downloadPyPackage(type: Exec) {
  description 'Downloads Python dependencies for running matches.'
  group 'battlecode'
  commandLine python, pythonScript.absolutePath, 'update',
        '--on-saturn', (project.findProperty("onSaturn") ?: "false").toString(),
        '--debug', (project.findProperty("debug") ?: "false").toString(),
        '--force-reinstall', (project.findProperty("forceReinstallPy") ?: "false").toString()
}

def truncateString(String input, int maxLength) {
  if (input.length() > maxLength) {
    return input.substring(0, maxLength)
  }
  return input
}

def defaultClassLocation = sourceSets.main.output.classesDirs.getAsPath()
def defaultReplayName = truncateString(project.property('teamA') + '-vs-' + project.property('teamB') + '-on-' + project.property('maps'), 80)
def defaultReplayFile = 'matches/' + defaultReplayName + '.bc26'

task runJavaLocal(type: JavaExec) {
  dependsOn classes
  mainClass = 'battlecode.server.Main'
  classpath = sourceSets.main.runtimeClasspath
  args = ['-c=-']
  jvmArgs = [
    '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED',
    '--add-opens=java.base/jdk.internal.math=ALL-UNNAMED',
    '--add-opens=java.base/jdk.internal.util=ALL-UNNAMED',
    '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED',
    '--add-opens=java.base/sun.security.action=ALL-UNNAMED',
    '-Dbc.server.wait-for-client=' + (project.findProperty('waitForClient') ?: 'false'),
    '-Dbc.server.mode=headless',
    '-Dbc.server.map-path=maps',
    '-Dbc.server.robot-player-to-system-out=' + (project.findProperty('outputVerbose') ?: 'true'),
    '-Dbc.server.debug=false',
    '-Dbc.engine.debug-methods=' + (project.findProperty('debug') ?: 'false'),
    '-Dbc.engine.enable-profiler=' + (project.findProperty('enableProfiler') ?: 'false'),
    '-Dbc.engine.show-indicators=' + (project.findProperty('showIndicators') ?: 'true'),
    '-Dbc.game.team-a=' + project.property('teamA'),
    '-Dbc.game.team-b=' + project.property('teamB'),
    '-Dbc.game.team-a.language=' + (project.findProperty('languageA') ?: 'java'),
    '-Dbc.game.team-b.language=' + (project.findProperty('languageB') ?: 'java'),
    '-Dbc.game.team-a.url=' + (project.findProperty('classLocationA') ?: defaultClassLocation),
    '-Dbc.game.team-b.url=' + (project.findProperty('classLocationB') ?: defaultClassLocation),
    '-Dbc.game.team-a.package=' + (project.findProperty('packageNameA') ?: project.property('teamA')),
    '-Dbc.game.team-b.package=' + (project.findProperty('packageNameB') ?: project.property('teamB')),
    '-Dbc.game.maps=' + project.property('maps'),
    '-Dbc.server.validate-maps=' + project.property('validateMaps'),
    '-Dbc.server.alternate-order=' + project.property('alternateOrder'),
    '-Dbc.server.save-file=' + (project.findProperty('replay') ?: defaultReplayFile),
  ]
}

task runJava(dependsOn: runJavaLocal) {}

task runPyLocal(type: Exec, dependsOn: installPyLocal) {
  commandLine python, '-m', 'battlecode26',
    '--teamA', project.findProperty('languageA') == 'python' ? project.property('teamA') : '/',
    '--teamB', project.findProperty('languageB') == 'python' ? project.property('teamB') : '/',
    '--dirA', botDirectory.absolutePath,
    '--dirB', botDirectory.absolutePath,
    '--new-process'
}

task runPy(type: Exec) {
  mustRunAfter downloadPyPackage
  commandLine python, '-m', 'battlecode26',
    '--teamA', project.findProperty('languageA') == 'python' ? project.property('teamA') : '/',
    '--teamB', project.findProperty('languageB') == 'python' ? project.property('teamB') : '/',
    '--dirA', botDirectory.absolutePath,
    '--dirB', botDirectory.absolutePath,
    '--new-process'
}

task runLocal {
  description 'Runs a match locally (no updates) without starting the client.'
  group 'battlecode'
  dependsOn runJavaLocal
}

task run {
  description 'Runs a match without starting the client.'
  group 'battlecode'
  dependsOn runJava
}

if (project.findProperty("languageA") == "python" || project.findProperty("languageB") == "python") {
  run.dependsOn downloadPyPackage
  run.dependsOn runPy
  runJava.mustRunAfter runPy
  runLocal.dependsOn installPyLocal
  runLocal.dependsOn runPyLocal
  runJavaLocal.mustRunAfter runPyLocal
}


//////// Informational ////////

task listPlayers {
  description 'Lists all available players.'
  group 'battlecode'

  doLast {
    sourceSets.main.allSource.each {
      logger.debug(it.name)
      if (it.getName().equals('RobotPlayer.java') || it.getName().equals('RobotPlayer.scala')) {
        URI base = new File(project.projectDir, 'src').toURI()
        URI full = it.toURI()
        String path = base.relativize(full).toString()
        logger.quiet(path.substring(0, path.lastIndexOf('/')).replaceAll('/', '.'))
      }
    }
  }
}

task listMaps {
  description 'Lists all available maps.'
  group 'battlecode'

  doLast {
    sourceSets.main.compileClasspath.each {
      logger.debug(it.name)
      if (it.toString().contains('battlecode26-')) {
        FileCollection fc = zipTree(it)
        fc += fileTree(new File(project.projectDir, 'maps'))
        fc.each {
          String fn = it.getName()
          if (fn.endsWith('.map26')) {
            logger.quiet(fn.substring(0, fn.indexOf('.map26')))
          }
        }
      }
    }
  }
}


